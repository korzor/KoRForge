<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KoRForge</title>
<style>
  :root {
    --fondo: #10131a;
    --panel: #171b24;
    --borde: #2a3140;
    --texto: #e8ecf4;
    --suave: #9aa4b5;
    --oro: #d9a441;
    --oro-fuerte: #f0c060;
    --error: #e25b4a;
    --ok: #4fbf7f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: "Segoe UI", Tahoma, sans-serif;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .tarjeta {
    width: 100%;
    height: 100%;
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .barra { padding: 8px 12px; display: flex;
    align-items: center;
    justify-content: space-between;
    
    -webkit-app-region: drag;
    background: linear-gradient(180deg, #1c2230, #171b24);
    border-bottom: 1px solid var(--borde);
  }
  .barra .nombre { font-weight: 700; letter-spacing: 1px; color: var(--oro); font-size: 13px; }
  .barra .botones { display: flex; gap: 6px; -webkit-app-region: no-drag; }
  .barra button {
    width: 26px; height: 22px; border: 0; border-radius: 4px; cursor: pointer;
    background: transparent; color: var(--suave); font-size: 13px;
  }
  .barra button:hover { background: #262d3d; color: var(--texto); }
  .cuerpo { padding: 18px 20px 16px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; justify-content: center; }
  img.logo { width: 44px; height: 44px; object-fit: contain; align-self: center; margin-bottom: 2px; }
  h1 { font-size: 17px; text-align: center; font-weight: 600; }
  .sub { color: var(--suave); text-align: center; font-size: 12px; line-height: 1.45; margin-bottom: 8px; }
  .boton-google {
    width: 100%; padding: 10px; border: 0; border-radius: 6px; cursor: pointer;
    background: #ffffff; color: #1f2937; font-weight: 600; font-size: 14px;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .boton-google:hover { filter: brightness(0.96); }
  .boton-google:disabled { opacity: .6; cursor: wait; }
  .boton-google svg { width: 18px; height: 18px; }
  .separador { height: 1px; background: var(--borde); margin: 4px 0; }
  .aviso { min-height: 18px; font-size: 12.5px; text-align: center; line-height: 1.5; }
  .aviso.error { color: var(--error); }
  .aviso.ok { color: var(--ok); }
  .aviso.info { color: var(--suave); }
  .boton-cancelar {
    width: 100%; padding: 9px; border: 1px solid var(--borde); border-radius: 6px; cursor: pointer;
    background: #1d2432; color: var(--texto); font-size: 12.5px;
  }
  .boton-cancelar:hover { background: #242d3f; }
  .pie { font-size: 11.5px; color: var(--suave); text-align: center; margin-top: 6px; }
  .pie a { color: var(--oro); text-decoration: none; cursor: pointer; }
  .pie a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="barra">
      <span class="nombre">KORFORGE</span>
      <div class="botones">
        <button id="btnMin" title="Minimizar">—</button>
        <button id="btnCerrar" title="Cerrar">✕</button>
      </div>
    </div>
    <div class="cuerpo">
      <img class="logo" src="/korforge-logo.png" alt="KoRForge" onerror="this.remove()">
      <h1 id="tTitulo">Entra con Google</h1>
      <p class="sub" id="tSub">Inicia sesión con tu cuenta de Google de centolos.org para usar KoRForge.</p>

      <button class="boton-google" id="btnGoogle">
        <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        <span>Entrar con Google</span>
      </button>
      <button class="boton-cancelar" id="btnCancelar" style="display:none">Cancelar</button>

      <div class="aviso" id="aviso"></div>
      <p class="pie"><span id="tCuenta">Solo cuentas de Google autorizadas.</span></p>
      <p class="pie pie-telegram"><span id="tNuevas">¿Cuenta nueva?</span> <a id="telegram" href="#">@KoRRoSka en Telegram</a></p>
    </div>
  </div>

<script>
(function () {
  'use strict';
  const T = {
    es: {
      titulo: 'Entra con Google',
      sub: 'Inicia sesión con tu cuenta de Google de centolos.org para usar KoRForge.',
      google: 'Entrar con Google',
      cuenta: 'Solo cuentas de Google autorizadas.',
      nuevas: '¿Cuenta nueva?',
      telegram: 'Contacta con @KoRRoSka en Telegram y te la activamos.',
      espera: 'Esperando a que termines de entrar en la web…',
      noAutorizada: 'Esa cuenta de Google no está autorizada para KoRForge.',
      cancelado: 'Se ha cancelado el login.',
      sinConexion: 'No se pudo conectar con centolos.org. Comprueba tu conexión.',
      cancelar: 'Cancelar'
    },
    en: {
      titulo: 'Sign in with Google',
      sub: 'Sign in with your Google account of centolos.org to use KoRForge.',
      google: 'Sign in with Google',
      cuenta: 'Only authorized Google accounts.',
      nuevas: 'New account?',
      telegram: 'Message @KoRRoSka on Telegram and we will activate it.',
      espera: 'Waiting for you to finish signing in on the web…',
      noAutorizada: 'That Google account is not authorized for KoRForge.',
      cancelado: 'Sign-in was cancelled.',
      sinConexion: 'Could not reach centolos.org. Check your connection.',
      cancelar: 'Cancel'
    },
    gl: {
      titulo: 'Entra con Google',
      sub: 'Inicia sesión coa túa conta de Google de centolos.org para usar KoRForge.',
      google: 'Entrar con Google',
      cuenta: 'Só contas de Google autorizadas.',
      nuevas: '¿Conta nova?',
      telegram: 'Contacta con @KoRRoSka en Telegram e activámoste.',
      espera: 'Agardando a que remates de entrar na web…',
      noAutorizada: 'Esa conta de Google non está autorizada para KoRForge.',
      cancelado: 'Cancelouse o inicio de sesión.',
      sinConexion: 'Non se puido conectar con centolos.org. Comproba a túa conexión.',
      cancelar: 'Cancelar'
    },
    fr: {
      titulo: 'Connexion avec Google',
      sub: 'Connectez-vous avec votre compte Google de centolos.org pour utiliser KoRForge.',
      google: 'Se connecter avec Google',
      cuenta: 'Comptes Google autorisés uniquement.',
      nuevas: 'Nouveau compte ?',
      telegram: 'Écris à @KoRRoSka sur Telegram et nous l\'activons.',
      espera: 'En attente de votre connexion sur le web…',
      noAutorizada: 'Ce compte Google n\'est pas autorisé pour KoRForge.',
      cancelado: 'Connexion annulée.',
      sinConexion: 'Impossible de joindre centolos.org. Vérifiez votre connexion.',
      cancelar: 'Annuler'
    },
    it: {
      titulo: 'Accedi con Google',
      sub: 'Accedi con il tuo account Google di centolos.org per usare KoRForge.',
      google: 'Accedi con Google',
      cuenta: 'Solo account Google autorizzati.',
      nuevas: 'Nuovo account?',
      telegram: 'Scrivi a @KoRRoSka su Telegram e lo attiviamo.',
      espera: 'In attesa che completi l\'accesso sul web…',
      noAutorizada: 'Questo account Google non è autorizzato per KoRForge.',
      cancelado: 'Accesso annullato.',
      sinConexion: 'Impossibile raggiungere centolos.org. Controlla la connessione.',
      cancelar: 'Annulla'
    }
  };

  const qs = new URLSearchParams(location.search);
  const idioma = T[qs.get('lang')] ? qs.get('lang') : 'es';
  const t = T[idioma];
  const $ = (id) => document.getElementById(id);

  const api = window.electronAPI || {};
  const auth = api.korforgeAuth || {
    googleIniciar: async () => ({ ok: false, error: t.sinConexion })
  };


  $('tTitulo').textContent = t.titulo;
  $('tSub').textContent = t.sub;
  $('btnGoogle').querySelector('span').textContent = t.google;
  $('tCuenta').textContent = t.cuenta;
  $('tNuevas').textContent = t.nuevas;
  $('telegram').title = t.telegram;
  $('telegram').addEventListener('click', (e) => { e.preventDefault(); if (api.openExternal) api.openExternal('https://t.me/KoRRoSka'); });
  $('btnCancelar').textContent = t.cancelar;

  const aviso = $('aviso');
  function ponerAviso(texto, tipo) {
    aviso.textContent = texto || '';
    aviso.className = 'aviso' + (tipo ? ' ' + tipo : '');
  }


  $('btnMin').addEventListener('click', () => api.minimize && api.minimize());
  $('btnCerrar').addEventListener('click', () => (api.close ? api.close() : window.close()));
  $('tCuenta').addEventListener('click', () => {});

  let pollGoogle = null;

  function pararSondeo() {
    if (pollGoogle) { clearInterval(pollGoogle); pollGoogle = null; }
    $('btnCancelar').style.display = 'none';
  }

  async function entrarConGoogle() {
    const btn = $('btnGoogle');
    btn.disabled = true;
    pararSondeo();
    ponerAviso(t.espera, 'info');
    $('btnCancelar').style.display = 'block';
    try {
      const r = await auth.googleIniciar();
      if (!r || !r.ok) {
        pararSondeo();
        btn.disabled = false;
        ponerAviso((r && r.error) || t.sinConexion, 'error');
        return;
      }
      const inicio = Date.now();
      pollGoogle = setInterval(async () => {
        if (Date.now() - inicio > 180000) { /* 3 min máximo */
          pararSondeo();
          btn.disabled = false;
          ponerAviso(t.cancelado, 'info');
          return;
        }
        const p = await auth.googleSondeo(r.state);
        if (p && p.ready) {
          pararSondeo();
          btn.disabled = false;
          if (p.permitido) return; /* la app se abre sola */
          ponerAviso(t.noAutorizada + ' ' + t.telegram, 'error');
        }
      }, 2000);
    } catch (_) {
      pararSondeo();
      btn.disabled = false;
      ponerAviso(t.sinConexion, 'error');
    }
  }

  $('btnGoogle').addEventListener('click', entrarConGoogle);
  $('btnCancelar').addEventListener('click', () => {
    pararSondeo();
    $('btnGoogle').disabled = false;
    ponerAviso(t.cancelado, 'info');
  });
})();
</script>
</body>
</html>
