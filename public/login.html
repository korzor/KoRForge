<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KoRForge</title>
<style>
  :root {
    --fondo: #10131a;
    --panel: #171b24;
    --borde: #2a3140;
    --texto: #e8ecf4;
    --suave: #9aa4b5;
    --oro: #d9a441;
    --oro-fuerte: #f0c060;
    --error: #e25b4a;
    --ok: #4fbf7f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--fondo);
    color: var(--texto);
    font-family: "Segoe UI", Tahoma, sans-serif;
    font-size: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
  }
  .tarjeta {
    width: 100%;
    height: 100%;
    background: var(--panel);
    border: 1px solid var(--borde);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .barra {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    -webkit-app-region: drag;
    background: linear-gradient(180deg, #1c2230, #171b24);
    border-bottom: 1px solid var(--borde);
  }
  .barra .nombre { font-weight: 700; letter-spacing: 1px; color: var(--oro); font-size: 13px; }
  .barra .botones { display: flex; gap: 6px; -webkit-app-region: no-drag; }
  .barra button {
    width: 26px; height: 22px; border: 0; border-radius: 4px; cursor: pointer;
    background: transparent; color: var(--suave); font-size: 13px;
  }
  .barra button:hover { background: #262d3d; color: var(--texto); }
  .cuerpo { padding: 22px 28px 24px; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  img.logo { width: 64px; height: 64px; object-fit: contain; align-self: center; margin-bottom: 2px; }
  h1 { font-size: 20px; text-align: center; font-weight: 600; }
  .sub { color: var(--suave); text-align: center; font-size: 12.5px; line-height: 1.5; margin-bottom: 6px; }
  label { font-size: 12px; color: var(--suave); margin-top: 4px; }
  input {
    width: 100%; padding: 9px 11px; border-radius: 6px; border: 1px solid var(--borde);
    background: #0d1017; color: var(--texto); font-size: 14px; outline: none;
  }
  input:focus { border-color: var(--oro); }
  .boton-primario {
    margin-top: 6px; width: 100%; padding: 10px; border: 0; border-radius: 6px; cursor: pointer;
    background: linear-gradient(180deg, var(--oro-fuerte), var(--oro)); color: #1a1406;
    font-weight: 700; font-size: 14px;
  }
  .boton-primario:hover { filter: brightness(1.07); }
  .boton-primario:disabled { opacity: .55; cursor: wait; }
  .separador { display: flex; align-items: center; gap: 10px; color: var(--suave); font-size: 11.5px; margin: 6px 0; }
  .separador::before, .separador::after { content: ""; flex: 1; height: 1px; background: var(--borde); }
  .boton-secundario {
    width: 100%; padding: 10px; border: 1px solid var(--borde); border-radius: 6px; cursor: pointer;
    background: #1d2432; color: var(--texto); font-size: 13.5px; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .boton-secundario:hover { background: #242d3f; }
  .boton-secundario:disabled { opacity: .55; cursor: wait; }
  .aviso { min-height: 18px; font-size: 12.5px; text-align: center; line-height: 1.5; }
  .aviso.error { color: var(--error); }
  .aviso.ok { color: var(--ok); }
  .aviso.info { color: var(--suave); }
  .pie { font-size: 11.5px; color: var(--suave); text-align: center; margin-top: 4px; }
  .pie a { color: var(--oro); text-decoration: none; cursor: pointer; }
  .pie a:hover { text-decoration: underline; }
</style>
</head>
<body>
  <div class="tarjeta">
    <div class="barra">
      <span class="nombre">KORFORGE</span>
      <div class="botones">
        <button id="btnMin" title="Minimizar">—</button>
        <button id="btnCerrar" title="Cerrar">✕</button>
      </div>
    </div>
    <div class="cuerpo">
      <img class="logo" src="/korforge-logo.png" alt="KoRForge" onerror="this.remove()">
      <h1 id="tTitulo">Bienvenido</h1>
      <p class="sub" id="tSub">Inicia sesión con tu cuenta de centolos.org para usar KoRForge.</p>

      <label id="tUsuario" for="usuario">Usuario</label>
      <input id="usuario" autocomplete="username" spellcheck="false">
      <label id="tPass" for="pass">Contraseña</label>
      <input id="pass" type="password" autocomplete="current-password">

      <button class="boton-primario" id="btnEntrar">Entrar</button>

      <div class="separador" id="tO">o</div>

      <button class="boton-secundario" id="btnGoogle">Entrar con Google</button>

      <div class="aviso" id="aviso"></div>
      <p class="pie"><span id="tNoCuenta">¿No tienes cuenta?</span> <a id="registro" href="#">centolos.org</a></p>
    </div>
  </div>

<script>
(function () {
  'use strict';
  const T = {
    es: {
      titulo: 'Bienvenido',
      sub: 'Inicia sesión con tu cuenta de centolos.org para usar KoRForge.',
      usuario: 'Usuario', pass: 'Contraseña', entrar: 'Entrar', o: 'o', google: 'Entrar con Google',
      noCuenta: '¿No tienes cuenta?',
      esperaEntrar: 'Entrando…',
      esperaGoogle: 'Esperando a que entres en la web…',
      noAutorizada: 'Tu cuenta no está autorizada para KoRForge. Pide que te añadan a la lista.',
      googleNoAutorizada: 'La cuenta que has usado no está autorizada para KoRForge.',
      googleCancelado: 'Se ha cancelado el login con Google.',
      sinConexion: 'No se pudo conectar con centolos.org. Comprueba tu conexión.',
      formato: 'Escribe tu usuario y contraseña.'
    },
    en: {
      titulo: 'Welcome',
      sub: 'Sign in with your centolos.org account to use KoRForge.',
      usuario: 'Username', pass: 'Password', entrar: 'Sign in', o: 'or', google: 'Sign in with Google',
      noCuenta: 'No account yet?',
      esperaEntrar: 'Signing in…',
      esperaGoogle: 'Waiting for you to sign in on the web…',
      noAutorizada: 'Your account is not authorized for KoRForge. Ask to be added to the list.',
      googleNoAutorizada: 'The account you used is not authorized for KoRForge.',
      googleCancelado: 'Google sign-in was cancelled.',
      sinConexion: 'Could not reach centolos.org. Check your connection.',
      formato: 'Enter your username and password.'
    },
    gl: {
      titulo: 'Benvido',
      sub: 'Inicia sesión coa túa conta de centolos.org para usar KoRForge.',
      usuario: 'Usuario', pass: 'Contrasinal', entrar: 'Entrar', o: 'ou', google: 'Entrar con Google',
      noCuenta: '¿Aínda non tes conta?',
      esperaEntrar: 'Entrando…',
      esperaGoogle: 'Agardando a que entres na web…',
      noAutorizada: 'A túa conta non está autorizada para KoRForge. Pide que te engadan á lista.',
      googleNoAutorizada: 'A conta que usaches non está autorizada para KoRForge.',
      googleCancelado: 'Cancelouse o inicio de sesión con Google.',
      sinConexion: 'Non se puido conectar con centolos.org. Comproba a túa conexión.',
      formato: 'Escribe o teu usuario e contrasinal.'
    },
    fr: {
      titulo: 'Bienvenue',
      sub: 'Connectez-vous avec votre compte centolos.org pour utiliser KoRForge.',
      usuario: 'Utilisateur', pass: 'Mot de passe', entrar: 'Se connecter', o: 'ou', google: 'Se connecter avec Google',
      noCuenta: 'Pas encore de compte ?',
      esperaEntrar: 'Connexion…',
      esperaGoogle: 'En attente de votre connexion sur le web…',
      noAutorizada: 'Votre compte n\'est pas autorisé pour KoRForge. Demandez à être ajouté à la liste.',
      googleNoAutorizada: 'Le compte utilisé n\'est pas autorisé pour KoRForge.',
      googleCancelado: 'La connexion Google a été annulée.',
      sinConexion: 'Impossible de joindre centolos.org. Vérifiez votre connexion.',
      formato: 'Entrez votre utilisateur et votre mot de passe.'
    },
    it: {
      titulo: 'Benvenuto',
      sub: 'Accedi con il tuo account centolos.org per usare KoRForge.',
      usuario: 'Utente', pass: 'Password', entrar: 'Accedi', o: 'oppure', google: 'Accedi con Google',
      noCuenta: 'Non hai un account?',
      esperaEntrar: 'Accesso…',
      esperaGoogle: 'In attesa che accedi sul web…',
      noAutorizada: 'Il tuo account non è autorizzato per KoRForge. Chiedi di essere aggiunto alla lista.',
      googleNoAutorizada: 'L\'account usato non è autorizzato per KoRForge.',
      googleCancelado: 'Accesso con Google annullato.',
      sinConexion: 'Impossibile raggiungere centolos.org. Controlla la connessione.',
      formato: 'Inserisci utente e password.'
    }
  };

  const qs = new URLSearchParams(location.search);
  const idioma = T[qs.get('lang')] ? qs.get('lang') : 'es';
  const t = T[idioma];
  const $ = (id) => document.getElementById(id);

  $('tTitulo').textContent = t.titulo;
  $('tSub').textContent = t.sub;
  $('tUsuario').textContent = t.usuario;
  $('tPass').textContent = t.pass;
  $('btnEntrar').textContent = t.entrar;
  $('tO').textContent = t.o;
  $('btnGoogle').textContent = t.google;
  $('tNoCuenta').textContent = t.noCuenta;

  const aviso = $('aviso');
  function ponerAviso(texto, tipo) {
    aviso.textContent = texto || '';
    aviso.className = 'aviso' + (tipo ? ' ' + tipo : '');
  }

  const api = window.electronAPI || {};
  const auth = api.korforgeAuth || {
    login: async () => ({ ok: false, error: t.sinConexion })
  };

  $('btnMin').addEventListener('click', () => api.minimize && api.minimize());
  $('btnCerrar').addEventListener('click', () => (api.close ? api.close() : window.close()));
  $('registro').addEventListener('click', (e) => {
    e.preventDefault();
    if (api.openExternal) api.openExternal('https://centolos.org');
  });

  let esperandoGoogle = null;
  let pollGoogle = null;

  function pararSondeo() {
    if (pollGoogle) { clearInterval(pollGoogle); pollGoogle = null; }
    if (esperandoGoogle) { esperandoGoogle.remove(); esperandoGoogle = null; }
  }

  async function entrarConPassword() {
    const usuario = $('usuario').value.trim();
    const pass = $('pass').value;
    if (!usuario || !pass) { ponerAviso(t.formato, 'error'); return; }
    const btn = $('btnEntrar');
    btn.disabled = true;
    ponerAviso(t.esperaEntrar, 'info');
    try {
      const r = await auth.login(usuario, pass);
      if (r && r.ok) {
        if (r.permitido) {
          ponerAviso('', '');
          /* La ventana principal se abre sola desde KoRForge */
        } else {
          ponerAviso(t.noAutorizada, 'error');
        }
      } else {
        ponerAviso((r && r.error) || t.sinConexion, 'error');
      }
    } catch (_) {
      ponerAviso(t.sinConexion, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  async function entrarConGoogle() {
    const btn = $('btnGoogle');
    btn.disabled = true;
    pararSondeo();
    ponerAviso(t.esperaGoogle, 'info');
    esperandoGoogle = document.createElement('button');
    esperandoGoogle.className = 'boton-secundario';
    esperandoGoogle.style.marginTop = '4px';
    esperandoGoogle.textContent = '✕';
    esperandoGoogle.title = t.googleCancelado;
    esperandoGoogle.addEventListener('click', () => {
      pararSondeo();
      btn.disabled = false;
      ponerAviso(t.googleCancelado, 'info');
    });
    $('btnGoogle').after(esperandoGoogle);
    try {
      const r = await auth.googleIniciar();
      if (!r || !r.ok) {
        pararSondeo();
        btn.disabled = false;
        ponerAviso((r && r.error) || t.sinConexion, 'error');
        return;
      }
      const inicio = Date.now();
      pollGoogle = setInterval(async () => {
        if (Date.now() - inicio > 180000) { /* 3 min máximo */
          pararSondeo();
          btn.disabled = false;
          ponerAviso(t.googleCancelado, 'info');
          return;
        }
        const p = await auth.googleSondeo(r.state);
        if (p && p.ready) {
          pararSondeo();
          btn.disabled = false;
          if (p.permitido) return; /* la app se abre sola */
          ponerAviso(t.googleNoAutorizada, 'error');
        }
      }, 2000);
    } catch (_) {
      pararSondeo();
      btn.disabled = false;
      ponerAviso(t.sinConexion, 'error');
    }
  }

  $('btnEntrar').addEventListener('click', entrarConPassword);
  $('btnGoogle').addEventListener('click', entrarConGoogle);
  $('pass').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') entrarConPassword();
  });
})();
</script>
</body>
</html>
